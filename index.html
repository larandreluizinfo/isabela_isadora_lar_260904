<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0507;
    color: #f2e9e0;
    font-family: 'VT323', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;

    position: fixed;

    transition: filter 1.2s ease;
  }

  body.upside #bg {
    filter: hue-rotate(140deg) saturate(1.4) brightness(.8);
    background:
      radial-gradient(circle at 30% 30%, rgba(150, 0, 130, .35), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(40, 0, 60, .6), transparent 55%),
      #07020a;
  }
  body.upside #flicker { opacity: .35; }
  body.upside #storyBox {
    border-color: rgba(150, 60, 200, .7);
    box-shadow: inset 0 0 40px rgba(70, 0, 90, .6), 0 0 30px rgba(120, 0, 160, .25);
  }
  body.upside h2 { color: #a55fe5; }
  body.upside button { border-color: #a55fe5; background: rgba(140, 40, 200, .12); }
  body.upside button:hover:not(:disabled) { background: #a55fe5; box-shadow: 0 0 26px rgba(160,80,240,.8); }

  #flicker {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 2px, transparent 2px 4px);

  }

  #app {
    width: min(860px, 94vw);
    margin: 24px auto;
    padding: 24px;
    text-align: center;
  }

  /* ---------- TITLE ---------- */
  #title {
    padding: 30px 6px;

  }
  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(26px, 7vw, 58px);
    color: #e50914;
    letter-spacing: 4px;
    text-shadow: 3px 3px 0 #fff, -3px -3px 0 #000, 0 0 40px rgba(229,9,20,.9);

    margin-top: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 22px);
    color: #e50914;
    margin-bottom: 20px;
    text-shadow: 2px 2px 0 #000;
  }

  /* ---------- UI ELEMENTS ---------- */
  button {
    cursor: pointer;
    border: 2px solid #e50914;
    background: rgba(229, 9, 20, .12);
    color: #f2e9e0;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 2.4vw, 15px);
    padding: 14px 22px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all .18s ease;
  }
  button:hover:not(:disabled) {
    background: #e50914;
    color: #fff;
    box-shadow: 0 0 26px rgba(229,9,20,.8);
    transform: scale(1.05);
  }
  button:disabled {
    opacity: .35;
    cursor: not-allowed;
    border-color: #555;
  }
  button.small { font-family: 'VT323', monospace; font-size: 20px; padding: 8px 16px; }

  #storyBox {
    background: rgba(20, 8, 12, .9);
    border: 1px solid rgba(229, 9, 20, .55);
    border-radius: 8px;
    padding: 22px 24px;
    margin: 18px 0;
    text-align: left;
    font-size: clamp(20px, 3.2vw, 26px);
    line-height: 1.45;
    box-shadow: inset 0 0 40px rgba(120,0,10,.35), 0 0 30px rgba(229,9,20,.15);
    white-space: pre-wrap;
    animation: rise .5s ease both;
  }

  #choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 20px auto 0;
    max-width: 520px;
    animation: rise .6s .1s ease both;
  }

  .hidden { display: none !important; }

  #hpRow {
    display: flex;
    justify-content: space-around;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;

  .barWrap { width: 200px; }
  .bar {

    border: 2px solid #c9c2ba;
    border-radius: 3px;
    background: #1c0e12;
    overflow: hidden;

    color: #fff;

    border: 2px solid #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
  }
</style>

const $ = id => document.getElementById(id);

/* ================= TELA INICIAL ================= */
$('btnStart').addEventListener('click', () => {
  $('title').classList.add('hidden');
  $('game').classList.remove('hidden');
  S.speed = Math.min(100, Math.max(1, prompt('Velocidade do texto (1 a 100, padrão 18)?', '18') || 18));
  showRoom('schoolIntro');
});

/* ================= NARRADOR ================= */
let typingTimer = null, typeIndex = 0, currentFull = '';

function typeText(id, text, done) {
  const el = $(id);
  el.classList.remove('hidden');
  el.innerHTML = '';
  currentFull = text;
  typeIndex = 0;
  clearInterval(typingTimer);
  el.style.opacity = '1';

  const step = () => {
    typeIndex += 3;
    el.innerHTML = esc(currentFull.slice(0, typeIndex));
    if (typeIndex >= currentFull.length) {
      clearInterval(typingTimer);
      setTimeout(done, 250);
    }
  };
  typingTimer = setInterval(step, S.speed);
  step();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ================= COMBATE ================= */
const B = {
  enemyActions: []
};

function showRoom(key) {
  clearInterval(typingTimer);
  $('log').classList.add('hidden');
  $('battleChoices').classList.add('hidden');
  $('npcStatus').classList.add('hidden');
  if (key === 'restart') {
    location.reload();
    return;
  }

  if (key === 'upsideBattle' || key === 'upsideIntro' || key === 'upsideExplore' || key === 'vecnaIntro' || key === 'vecnaBattle') {
    document.body.classList.add('upside');
  } else {
    document.body.classList.remove('upside');
  }

  if (key === 'battle') {
    S.playerHp = S.playerMax;
    S.bossHp = S.bossMax;
    S.guard = false;
    S.flameCd = 0;
    S.turn = 1;
    renderBars();
    fillAllyList();
    $('chapter').textContent = 'Capítulo 2 · A Batalha de Alderac';
    $('log').classList.remove('hidden');
    $('battleChoices').classList.remove('hidden');
    $('npcStatus').classList.remove('hidden');
    $('storyBox').classList.add('hidden');
    S.logVisible = true;
    addLog('⚔️ Um rugido rasga a Floresta Sombria. O DEMOGORGON surge diante de vocês!');
    addLog('🐉 Dragãozinho protege a festa. Seus aliados lutam ao seu lado.');
    renderActions();
    return;
  }

  if (key === 'upsideBattle') {
    S.udHp = S.udMax;
    S.udBossHp = S.udBossMax;
    S.udGuard = false;
    S.udFocus = 2;
    renderUD();
    $('chapter').textContent = 'Capítulo 3 · Batalha no Mundo Invertido';
    $('log').classList.remove('hidden');
    $('battleChoices').classList.remove('hidden');
    $('npcStatus').classList.remove('hidden');
    $('npcStatus').textContent = '🌑 Mundo Invertido · Eleven enfrenta o Demogorgon REAL';
    $('storyBox').classList.add('hidden');
    addLog('👁️ O ar se rasga. O DEMOGORGON REAL abre as mandíbulas diante da Eleven.');
    addLog('🦸 Eleven: "Solte o Will. AGORA."');
    renderUDActions();
    return;
  }

  if (key === 'vecnaBattle') {
    S.vHp = S.vMax;
    S.vElevenHp = S.vElevenMax;
    S.vGuard = false;
    S.vMusic = 3;
    renderVecna();
    $('chapter').textContent = 'Capítulo 4 · A Batalha Contra Vecna';
    $('log').classList.remove('hidden');
    $('battleChoices').classList.remove('hidden');
    $('npcStatus').classList.remove('hidden');
    $('npcStatus').textContent = '☠️ Vecna · a mente que governa as sombras';
    $('storyBox').classList.add('hidden');
    addLog('🧙 VECNA ergue a mão e o tempo para. A Creel House range.');
    addLog('🎵 Do rádio de Max, uma música toca forte: "Running Up That Hill".');
    addLog('🦸 Eleven: "Você não leva mais ninguém, Vecna."');
    renderVecnaActions();
    return;
  }

  const sc = scenes[key];
  if (!sc) return;
  S.logVisible = false;
  $('chapter').textContent = sc.chapter;
  $('choices').classList.add('hidden');

  if (sc.npcs) {
    $('npcStatus').classList.remove('hidden');
    $('npcStatus').textContent = '🎭 ' + sc.npcs;
  } else {
    $('npcStatus').classList.add('hidden');
  }

  if (sc.party) {
    fillAllyList();
    $('npcStatus').classList.remove('hidden');
  }

  $('battleChoices').classList.add('hidden');
  $('log').classList.add('hidden');

  typeText('storyBox', sc.text, () => {
    if (sc.choices && sc.choices.length) {
      renderChoices(sc.choices);
    } else {
      $('choices').classList.add('hidden');
    }
  });
}

function renderChoices(ch) {
  const box = $('choices');
  box.innerHTML = '';
  box.classList.remove('hidden');
  ch.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = c.text;
    b.onclick = () => {
      if (c.msg) {
        addLog(c.msg, false);
      }
      box.classList.add('hidden');
      showRoom(c.next);
    };
    box.appendChild(b);
  });
}

/* ================= BARRAS / ALIADOS ================= */
function fillAllyList() {
  const el = $('npcStatus');
  el.textContent = 'Aliados: ' + S.chars.join(' · ');
}

function renderBars() {
  const pp = Math.max(0, Math.round(S.playerHp / S.playerMax * 100));
  $('playerBar').style.width = pp + '%';
  $('playerHp').textContent = `Time: ${S.playerHp}/${S.playerMax} HP`;

  const bp = Math.max(0, Math.round(S.bossHp / S.bossMax * 100));
  $('enemyBar').style.width = bp + '%';
  $('enemyHp').textContent = `Demogorgon: ${S.bossHp}/${S.bossMax} HP`;
}

function renderUD() {
  const pp = Math.max(0, Math.round(S.udHp / S.udMax * 100));
  $('playerBar').style.width = pp + '%';
  $('playerHp').textContent = `Eleven: ${S.udHp}/${S.udMax} HP`;

  const bp = Math.max(0, Math.round(S.udBossHp / S.udBossMax * 100));
  $('enemyBar').style.width = bp + '%';
  $('enemyHp').textContent = `Demogorgon REAL: ${S.udBossHp}/${S.udBossMax} HP`;
}

function renderVecna() {
  const pp = Math.max(0, Math.round(S.vElevenHp / S.vElevenMax * 100));
  $('playerBar').style.width = pp + '%';
  $('playerHp').textContent = `Eleven: ${S.vElevenHp}/${S.vElevenMax} HP`;

  const bp = Math.max(0, Math.round(S.vHp / S.vMax * 100));
  $('enemyBar').style.width = bp + '%';
  $('enemyHp').textContent = `Vecna: ${S.vHp}/${S.vMax} HP`;
}

function addLog(line, visible = true) {
  const logEl = $('log');
  logEl.innerHTML += `<div>${line}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

/* ================= AÇÕES DE BATALHA ================= */
function renderActions() {
  const box = $('battleChoices');
  box.innerHTML = '';
  const actions = [
    { id: 'attack', label: '⚔️ ATACAR' },
    { id: 'guard', label: '🛡️ DEFENDER' },
    { id: 'flame', label: '🔥 FOGO DA CORAGEM' }
  ];
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.textContent = a.label;
    btn.id = 'act_' + a.id;
    if (a.id === 'flame') btn.disabled = S.flameCd > 0;
    btn.onclick = () => playerAction(a.id);
    box.appendChild(btn);
  });
}

function playerAction(type) {
  if (S.bossHp <= 0) return;

  if (type === 'attack') {
    const roll = Math.floor(Math.random() * (S.bossMax + 1)) + 1;
    addLog(`🎲 Você rola um dado d${S.bossMax}... cai ${roll}!`);
    if (roll >= S.bossMax - 8) {
      const dmg = 20 + roll;
      S.bossHp -= dmg;
      addLog(`💥 COURO DO DRAGÃO! O DEMOGORGON perde ${dmg} HP!`);
    } else if (roll === 1) {
      addLog('💨 Falhou! O ataque erra feio.');
    } else {
      const dmg = 12 + roll;
      S.bossHp -= dmg;
      addLog(`🐉 Ataque certeiro! O Demogorgon perde ${dmg} HP.`);
    }
    renderBars();
  }

  if (type === 'guard') {
    S.guard = true;
    addLog('🛡️ Você ergueu as escamas. O próximo golpe será mais fraco.');
  }

  if (type === 'flame') {
    if (S.flameCd > 0) return;
    const dmg = 16 + Math.floor(Math.random() * 12);
    S.bossHp -= dmg;
    S.flameCd = 2;
    addLog(`🔥 FOGO DA CORAGEM! Chamas azuis varrem o monstro (-${dmg} HP).`);
    renderBars();
  }

  checkBossDown();
  if (S.bossHp <= 0) return;

  allyPhase();
  if (S.bossHp <= 0) return;

  enemyTurn();
  renderActions();
}

function alleleMultiplier() {
  return 1 + (S.turn > 1 ? (S.turn % 2 === 0 ? 0.2 : 0.1) : 0);
}

function allyPhase() {
  addLog('--- Aliados atacam! ---');
  const allies = S.chars.slice(0, 5);
  allies.forEach(name => {
    const roll = Math.floor(Math.random() * 8) + 1;
    if (roll >= 3) {
      const dmg = Math.max(2, Math.floor(Math.random() * 9 + 2));
      S.bossHp -= dmg;
      addLog(`${name} ataca com sucesso (-${dmg} HP).`);
    } else {
      addLog(`${name} errou o ataque!`);
    }
  });
  checkBossDown();
  renderBars();
}

function enemyTurn() {
  if (S.bossHp <= 0) { renderBars(); return; }
  S.turn++;
  const roll = Math.floor(Math.random() * S.bossMax) + 1;
  addLog(`🎲 O DEMOGORGON revida com um d${S.bossMax}... ${roll}!`);
  S.bossHp = Math.max(0, S.bossHp);

  let dmg;
  if (roll === S.bossMax) {
    dmg = 34;
    addLog('😱 CRÍTICO DO MONSTRO! Golpe devastador!');
  } else if (roll <= S.bossMax / 3) {
    dmg = 10 + Math.floor(Math.random() * 8);
    addLog('🌫️ O lodo sombrio arde...');
  } else {
    dmg = 16 + Math.floor(Math.random() * 6);
    addLog('💢 O monstro avança e ataca o grupo!');
  }

  if (S.guard) {
    dmg = Math.round(dmg / 2);
    addLog('🛡️ Sua defesa reduziu o golpe pela metade!');
    S.guard = false;
    if (S.flameCd > 0) S.flameCd--;
  } else {
    if (S.flameCd > 0) S.flameCd--;
  }

  S.playerHp -= dmg;
  addLog(`💔 O time perde ${dmg} HP (restam ${Math.max(0, S.playerHp)}).`);
  renderBars();

  if (S.playerHp <= 0) {
    addLog('💀 O grupo foi derrotado...');
    setTimeout(() => {
      const box = $('battleChoices');
      box.innerHTML = '';
      box.classList.remove('hidden');
      const btn = document.createElement('button');
      btn.textContent = '🔄 TENTAR NOVAMENTE';
      btn.onclick = () => { showRoom('battle'); };
      box.appendChild(btn);
    }, 400);
  }
}

function checkBossDown() {
  if (S.bossHp <= 0) {
    S.bossHp = 0;
    renderBars();
    addLog('💥💥💥 O DEMOGORGON desaba! Flores negras caem do céu sombrio.');
    setTimeout(() => {
      $('battleChoices').classList.add('hidden');
      showRoom('win');
    }, 1200);
  }
}

/* ================= BATALHA NO MUNDO INVERTIDO ================= */
function renderUDActions() {
  const box = $('battleChoices');
  box.innerHTML = '';
  const actions = [
    { id: 'udAttack', label: '🔮 PODER TELEQUINÉTICO', disabled: false },
    { id: 'udFocus', label: '⚡ FOCAR A MENTE (COMBUSTÍVEL)', disabled: S.udFocus <= 0 },
    { id: 'udGuard', label: '🛡️ DEFENDER-SE', disabled: false }
  ];
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.textContent = a.label + (a.id === 'udFocus' ? ` (${S.udFocus})` : '');
    btn.disabled = a.disabled;
    btn.onclick = () => udPlayerAction(a.id);
    box.appendChild(btn);
  });
}

function udPlayerAction(type) {
  if (S.udBossHp <= 0) return;

  if (type === 'udAttack') {
    const roll = Math.floor(Math.random() * 20) + 1;
    addLog(`🎲 Eleven foca a mente... dado d20: ${roll}`);
    if (roll === 1) {
      addLog('💨 A energia falha! O foco se quebra.');
      S.udHp -= 6;
      addLog(`💔 A exaustão cobra: -6 HP (restam ${Math.max(0, S.udHp)}).`);
      renderUD();
    } else if (roll >= 17) {
      const dmg = 18 + Math.floor(Math.random() * 10);
      S.udBossHp -= dmg;
      addLog(`💥 EXPLOSÃO PSÍQUICA! O Demogorgon REAL perde ${dmg} HP!`);
      renderUD();
    } else if (roll >= 8) {
      const dmg = 8 + Math.floor(Math.random() * 8);
      S.udBossHp -= dmg;
      addLog(`🌀 O poder atinge o monstro: -${dmg} HP.`);
      renderUD();
    } else {
      addLog('🌫️ O monstro desvia da onda psíquica.');
    }
  }

  if (type === 'udFocus') {
    if (S.udFocus <= 0) return;
    S.udFocus--;
    const dmg = 20 + Math.floor(Math.random() * 14);
    S.udBossHp -= dmg;
    const heal = Math.min(S.udMax, S.udHp + 12);
    S.udHp = heal;
    addLog(`⚡ A memória de Mike e Will dá força à Eleven: -${dmg} HP no Demogorgon e +12 de energia.`);
    renderUD();
  }

  if (type === 'udGuard') {
    S.udGuard = true;
    addLog('🛡️ Eleven ergue uma barreira psíquica.');
  }

  checkUDDown();
  if (S.udBossHp <= 0) return;

  udEnemyTurn();
  renderUDActions();
}

function udEnemyTurn() {
  if (S.udBossHp <= 0) { renderUD(); return; }
  const roll = Math.floor(Math.random() * 20) + 1;
  addLog(`🎲 O Demogorgon REAL ataca... d20: ${roll}`);
  let dmg;
  if (roll === 20) {
    dmg = 22;
    addLog('😱 MANDÍBULAS DEVORADORAS!');
  } else if (roll >= 12) {
    dmg = 8 + Math.floor(Math.random() * 7);
    addLog('🐾 Garras do monstro cortam a névoa.');
  } else {
    dmg = 4 + Math.floor(Math.random() * 4);
    addLog('🌑 O monstro avança em silêncio.');
  }
  if (S.udGuard) {
    dmg = Math.max(1, Math.round(dmg / 2));
    addLog('🛡️ A barreira psíquica absorveu metade do golpe!');
    S.udGuard = false;
  }
  S.udHp -= dmg;
  addLog(`💔 Eleven perde ${dmg} HP (restam ${Math.max(0, S.udHp)}).`);
  renderUD();

  if (S.udHp <= 0) {
    addLog('🕳️ A névoa silencia. A Eleven cai... mas a memória dos amigos acende a luz de volta.');
    setTimeout(() => {
      S.udHp = S.udMax;
      renderUD();
      const box = $('battleChoices');
      box.innerHTML = '';
      box.classList.remove('hidden');
      const btn = document.createElement('button');
      btn.textContent = '🔄 RECOMEÇAR A BATALHA';
      btn.onclick = () => showRoom('upsideBattle');
      box.appendChild(btn);
    }, 900);
  }
}

function checkUDDown() {
  if (S.udBossHp <= 0) {
    S.udBossHp = 0;
    renderUD();
    addLog('💥 O Demogorgon REAL explode em cinzas! O Mundo Invertido treme.');
    setTimeout(() => {
      $('battleChoices').classList.add('hidden');
      showRoom('upsideWin');
    }, 1200);
  }
}

/* ================= BATALHA CONTRA VECNA ================= */
function renderVecnaActions() {
  const box = $('battleChoices');
  box.innerHTML = '';
  const actions = [
    { id: 'vNerve', label: '🧠 DETECTAR A MENTE DE VECNA', disabled: false },
    { id: 'vMusic', label: '🎵 FORÇA DA MÚSICA', disabled: S.vMusic <= 0 },
    { id: 'vGuard', label: '🛡️ RESISTIR À MALDIÇÃO', disabled: false }
  ];
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.textContent = a.label + (a.id === 'vMusic' ? ` (${S.vMusic})` : '');
    btn.disabled = a.disabled;
    btn.onclick = () => vecnaAction(a.id);
    box.appendChild(btn);
  });
}

function vecnaAction(type) {
  if (S.vHp <= 0) return;

  if (type === 'vNerve') {
    const roll = Math.floor(Math.random() * 20) + 1;
    addLog(`🎲 Eleven mergulha na mente de Vecna... d20: ${roll}`);
    if (roll === 1) {
      addLog('💀 Vecna inverte o ataque mental! A maldição retorna.');
      S.vElevenHp -= 8;
      addLog(`💔 Eleven perde 8 HP (restam ${Math.max(0, S.vElevenHp)}).`);
      renderVecna();
    } else if (roll >= 18) {
      const dmg = 20 + Math.floor(Math.random() * 12);
      S.vHp -= dmg;
      addLog(`💥 VOCÊ ACESSA O SEGREDO DELE! A mente de Vecna racha: -${dmg} HP!`);
      renderVecna();
    } else if (roll >= 9) {
      const dmg = 9 + Math.floor(Math.random() * 9);
      S.vHp -= dmg;
      addLog(`🌀 A telecinese arranca o sigilo de Vecna: -${dmg} HP.`);
      renderVecna();
    } else {
      addLog('🌫️ A mente de Vecna é um labirinto. O ataque mal arranha.');
    }
  }

  if (type === 'vMusic') {
    if (S.vMusic <= 0) return;
    S.vMusic--;
    const dmg = 18 + Math.floor(Math.random() * 12);
    S.vHp -= dmg;
    const heal = Math.min(S.vElevenMax, S.vElevenHp + 15);
    S.vElevenHp = heal;
    addLog(`🎵 A música dos amigos ergue a Eleven: -${dmg} HP no Vecna e +15 de esperança.`);
    renderVecna();
  }

  if (type === 'vGuard') {
    S.vGuard = true;
    addLog('🛡️ Eleven planta os pés e resiste à maldição.');
  }

  checkVecnaDown();
  if (S.vHp <= 0) return;

  vecnaTurn();
  renderVecnaActions();
}

function vecnaTurn() {
  if (S.vHp <= 0) { renderVecna(); return; }
  const roll = Math.floor(Math.random() * 20) + 1;
  addLog(`🎲 Vecna canaliza a maldição... d20: ${roll}`);
  let dmg;
  if (roll === 20) {
    dmg = 24;
    addLog('😱 A VOZ DE VECNA AGARRA O CÉU!');
  } else if (roll >= 13) {
    dmg = 9 + Math.floor(Math.random() * 8);
    addLog('🕸️ A maldição das sombras aperta o peito da Eleven.');
  } else {
    dmg = 5 + Math.floor(Math.random() * 4);
    addLog('🌑 Um sussurro frio passa pelos corredores.');
  }
  if (S.vGuard) {
    dmg = Math.max(1, Math.round(dmg / 2));
    addLog('🛡️ A resistência da Eleven segura metade da maldição!');
    S.vGuard = false;
  }
  S.vElevenHp -= dmg;
  addLog(`💔 Eleven perde ${dmg} HP (restam ${Math.max(0, S.vElevenHp)}).`);
  renderVecna();

  if (S.vElevenHp <= 0) {
    addLog('🕳️ O corpo de Eleven paira, os olhos reviram... mas a voz de Mike atravessa o silêncio: "ELEVEN!"');
    setTimeout(() => {
      S.vElevenHp = S.vElevenMax;
      renderVecna();
      const box = $('battleChoices');
      box.innerHTML = '';
      box.classList.remove('hidden');
      const btn = document.createElement('button');
      btn.textContent = '🔄 RESPIRAR E VOLTAR AO COMBATE';
      btn.onclick = () => showRoom('vecnaBattle');
      box.appendChild(btn);
    }, 900);
  }
}

function checkVecnaDown() {
  if (S.vHp <= 0) {
    S.vHp = 0;
    renderVecna();
    addLog('🔥 O trono de raízes queima. VECNA GRITA o próprio fim.');
    setTimeout(() => {
      $('battleChoices').classList.add('hidden');
      showRoom('vecnaWin');
    }, 1200);
  }
}
</script>
